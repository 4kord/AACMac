name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: brew install mingw-w64

      - name: Build, test and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-build.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/ArcheAge-Classic-$v.dmg" \
            --title "ArcheAge Classic for Mac $v" --generate-notes
